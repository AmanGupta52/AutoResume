name: Backend tests

on:
  push:
    paths: ['backend/**', 'web/**']
  pull_request:
    paths: ['backend/**', 'web/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test
        working-directory: backend
        run: |
          npm install
          npm test
