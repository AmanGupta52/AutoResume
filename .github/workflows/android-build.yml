name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Safety net: delete files from the old UI that clash with the rebuilt one.
      # (Remove this step once you have deleted them from the repository.)
      - name: Remove stale old-UI files
        run: |
          cd app/src/main/java/com/example/ui
          rm -f AtsAnalyzerScreen.kt AutoResumeScreens.kt AutoResumeMainScreens.kt \
                AutoResumeSecondaryFlows.kt AutoResumeEditorWorkspace.kt \
                WorkAndEducationEditorScreen.kt Neu.kt MainViewModel.kt theme/AppTheme.kt
          rm -rf locale
          # An earlier upload added .png icons next to the .webp ones; Android rejects duplicates.
          rm -f ../../../../res/mipmap-*/ic_launcher*.png

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner already ships the Android SDK; just accept licenses so Gradle can fetch platforms.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The project zip has no Gradle wrapper. Use it if you committed one, otherwise install Gradle.
      # AGP 9.x needs Gradle 9.x - bump the version below if the build says it needs a newer one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ hashFiles('gradlew') != '' && 'wrapper' || '9.3.1' }}

      - name: Create .env (NVIDIA key)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
        run: |
          cp .env.example .env
          if [ -n "$NVIDIA_API_KEY" ]; then
            sed -i "s|^NVIDIA_API_KEY=.*|NVIDIA_API_KEY=$NVIDIA_API_KEY|" .env
          fi
          if [ -n "$NVIDIA_MODEL" ]; then
            sed -i "s|^NVIDIA_MODEL=.*|NVIDIA_MODEL=$NVIDIA_MODEL|" .env
          fi

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
        continue-on-error: true   # a failing test is reported but never blocks the APK

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK (only if signing secrets exist)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoResume-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Attach APKs to GitHub Release (tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
